[project]
name = "data-compression"
version = "0.1.0"
description = "DrugComb download, inspection, and cell-line compression utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "PyTDC",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
